name: Audit national presidential vote totals
on:
  push:
    branches: [feat/e002-national-vote-audit]
    paths:
      - '.github/workflows/audit-national.yml'
      - 'src/electoral_analysis/vote_audit.py'
      - 'tests/test_vote_audit.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Official voting audit ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: 2022
            resource: president_2022
          - year: 2026
            resource: president_2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests and lint
        run: |
          python -m pytest -q
          python -m ruff check src tests
      - name: Download from TSE CDN
        run: |
          python -m electoral_analysis.cli download '${{ matrix.resource }}' --output-dir data/bronze/${{ matrix.year }}
      - name: Audit entire presidential voting CSV
        run: |
          python -m electoral_analysis.vote_audit data/bronze/${{ matrix.year }}/${{ matrix.resource }}.zip \
            --year '${{ matrix.year }}' \
            --out outputs/national/${{ matrix.year }}/national_vote_audit.json
      - name: Save small auditable results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: national-audit-${{ matrix.year }}
          path: |
            outputs/national/${{ matrix.year }}/
            data/bronze/${{ matrix.year }}/*.manifest.json
          retention-days: 14
          if-no-files-found: warn
