name: E003 inspect official turnout detail archives
on:
  push:
    branches: [feat/e003-turnout-geography]
    paths: ['.github/workflows/e003-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        year: [2022, 2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Download and inspect official archive
        shell: bash
        run: |
          mkdir -p outputs/e003
          python - <<'PY'
          import csv, hashlib, io, json, traceback
          from pathlib import Path
          from zipfile import ZipFile
          from electoral_analysis.sources import RESOURCES
          from electoral_analysis.acquisition import download_official
          year = ${{ matrix.year }}
          key = f"turnout_{year}"
          result = {"year": year, "source_url": RESOURCES[key].url}
          try:
              result["manifest"] = download_official(RESOURCES[key], Path("data") / str(year), max_bytes=2500000000)
              with ZipFile(Path("data") / str(year) / f"{key}.zip") as archive:
                  csv_members = [m for m in archive.namelist() if m.lower().endswith(".csv")]
                  result["csv_headers"] = {}
                  for member in csv_members:
                      with archive.open(member) as f:
                          lines = [f.readline(16000).decode("latin-1").strip() for _ in range(3)]
                          result["csv_headers"][member] = {"lines": lines}
              result["status"] = "downloaded"
          except Exception as exc:
              result.update(status="error", error=repr(exc), trace=traceback.format_exc(limit=3))
          p=Path("outputs/e003")/f"turnout_schema_{year}.json"
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({k:v for k,v in result.items() if k!="manifest"},ensure_ascii=False)[:12000])
          if result["status"]=="error":
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e003-turnout-schema-${{ matrix.year }}
          path: outputs/e003/
          retention-days: 14
