name: E006 IBGE Census and grouped municipal turnout evaluation
on:
  push:
    branches: [feat/e006-ibge-turnout-analysis]
    paths:
      - '.github/workflows/e006-census-turnout.yml'
      - 'src/electoral_analysis/ibge_turnout.py'
      - 'tests/test_ibge_turnout.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: |
          python -m pytest -q
          python -m ruff check src tests
      - name: Recover audited E005 municipal observations
        uses: actions/download-artifact@v4
        with:
          name: e005-neutral-aggregated-results
          path: .
          run-id: 39069589159
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify frozen source hashes of E005 panel
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          panel=json.loads(Path('outputs/e005-results/municipal_results.json').read_text())
          assert panel['matched_municipalities']==5570
          assert panel['source_hashes']['voting_2022']=='9353993de5cf03778aef44e01d4925e7ee105f5262491d344a2f0dbc956b0139'
          assert panel['source_hashes']['voting_2026']=='2d42006d0f6c6e00bad83f5c23cd3d78cd3e3182dbc1ad6718222b6b132c23e1'
          print('Verified prior official voting snapshots')
          PY
      - name: Get verified official TSE-IBGE municipality crosswalk
        run: |
          mkdir -p data/reference
          curl --fail --location --retry 2 --silent --show-error --max-time 120 \
            https://cdn.tse.jus.br/estatistica/sead/odsele/municipio_tse_ibge/municipio_tse_ibge.zip \
            --output data/reference/municipio_tse_ibge.zip
          echo '68328ddc166806594a2aab5809ac9aa602153535d6b8a71e886c337f9f3631ca  data/reference/municipio_tse_ibge.zip' | sha256sum --check
      - name: Retrieve and audit official IBGE Census 2022 data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from electoral_analysis.ibge_turnout import fetch_ibge
          record=fetch_ibge(Path('data/reference/ibge_4714_2022.json'))
          print(json.dumps(record, ensure_ascii=False))
          PY
      - name: Validate historical turnout with one state held out per fold
        run: |
          python -m electoral_analysis.ibge_turnout \
            --electoral-panel outputs/e005-results/municipal_results.json \
            --crosswalk-zip data/reference/municipio_tse_ibge.zip \
            --ibge-snapshot data/reference/ibge_4714_2022.json \
            --out outputs/e006/turnout_state_holdout.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e006-ibge-turnout-validation
          path: |
            outputs/e006/
            data/reference/ibge_4714_2022.json
          retention-days: 14
          if-no-files-found: warn
