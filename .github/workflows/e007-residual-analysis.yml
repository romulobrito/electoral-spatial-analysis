name: E007 regional diagnostics of aggregate turnout residuals
on:
  push:
    branches: [feat/e007-turnout-residuals]
    paths:
      - '.github/workflows/e007-residual-analysis.yml'
      - 'src/electoral_analysis/residual_diagnostics.py'
      - 'src/electoral_analysis/residual_figure.py'
      - 'tests/test_residual_diagnostics.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
          python -m ruff check src tests
      - name: Recover audited TSE aggregate from E005
        uses: actions/download-artifact@v4
        with:
          name: e005-neutral-aggregated-results
          path: .
          run-id: 39069589159
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover audited IBGE Census from E006
        uses: actions/download-artifact@v4
        with:
          name: e006-ibge-turnout-validation
          path: .
          run-id: 39072126444
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Acquire official TSE municipality crosswalk with SHA256
        run: |
          mkdir -p data/reference
          curl --fail --location --retry 2 --silent --show-error --max-time 120 \
            https://cdn.tse.jus.br/estatistica/sead/odsele/municipio_tse_ibge/municipio_tse_ibge.zip \
            -o data/reference/municipio_tse_ibge.zip
          echo '68328ddc166806594a2aab5809ac9aa602153535d6b8a71e886c337f9f3631ca  data/reference/municipio_tse_ibge.zip' | sha256sum --check
      - name: Run train-only regional correction and residual diagnostics
        run: |
          python -m electoral_analysis.residual_diagnostics \
            --electoral-panel outputs/e005-results/municipal_results.json \
            --ibge-snapshot data/reference/ibge_4714_2022.json \
            --crosswalk-zip data/reference/municipio_tse_ibge.zip \
            --out outputs/e007/residual_diagnostics.json
      - name: Render regional error chart and methods report
        run: |
          python -m electoral_analysis.residual_figure \
            outputs/e007/residual_diagnostics.json \
            --output-dir outputs/e007/rendered
      - name: Retain verified aggregate research diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e007-turnout-residuals
          path: outputs/e007/
          retention-days: 14
          if-no-files-found: warn
