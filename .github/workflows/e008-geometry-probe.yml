name: E008 probe official IBGE 2022 municipal geometries
on:
  push:
    branches: [feat/e008-spatial-autocorrelation]
    paths:
      - '.github/workflows/e008-geometry-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIS reader
        run: python -m pip install pyogrio
      - name: Download official 2022 municipal topology
        run: |
          mkdir -p data/ibge outputs/e008
          curl -fL --retry 3 --connect-timeout 20 --max-time 720 --silent --show-error \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2022/Brasil/BR/BR_Municipios_2022.zip' \
            -o data/ibge/BR_Municipios_2022.zip
      - name: Inspect ZIP, GIS structure, CRS and municipality codes
        run: |
          python - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          import pyogrio
          p=Path('data/ibge/BR_Municipios_2022.zip')
          members=[]
          with zipfile.ZipFile(p) as archive:
              for member in archive.infolist():
                  members.append({'name':member.filename,'size':member.file_size})
              shapefiles=[m.filename for m in archive.infolist() if m.filename.lower().endswith('.shp')]
              if len(shapefiles)!=1:
                  raise ValueError('Unexpected Shapefile count')
              archive.extractall('data/ibge/unpacked')
          path=Path('data/ibge/unpacked')/shapefiles[0]
          info=pyogrio.read_info(path)
          report={'source':'IBGE Malha Municipal 2022 BR',
                  'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                  'zip_bytes':p.stat().st_size,
                  'features':info.get('features'),
                  'fields':list(info.get('fields',[])),
                  'geometry_type':str(info.get('geometry_type')),
                  'crs':str(info.get('crs')),
                  'members':members}
          Path('outputs/e008/geometry_probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False)[:10000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e008-official-geometry-probe
          path: outputs/e008/
          retention-days: 14
