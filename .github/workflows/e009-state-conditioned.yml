name: E009 condition spatial autocorrelation on the state
on:
  push:
    branches: [feat/e009-state-conditioned-moran]
    paths:
      - '.github/workflows/e009-state-conditioned.yml'
      - 'src/electoral_analysis/state_conditional_moran.py'
      - 'src/electoral_analysis/conditional_moran_figure.py'
      - 'tests/test_state_conditional_moran.py'
      - 'tests/test_conditional_moran_figure.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  conditioned:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific and GIS dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install geopandas pyogrio shapely
      - name: Validate unit tests and Ruff
        run: |
          python -m pytest -q
          python -m ruff check src tests
      - name: Recover official TSE E005 electoral panel
        uses: actions/download-artifact@v4
        with:
          name: e005-neutral-aggregated-results
          path: .
          run-id: 39069589159
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover official IBGE E006 Census 2022 snapshot
        uses: actions/download-artifact@v4
        with:
          name: e006-ibge-turnout-validation
          path: .
          run-id: 39072126444
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Obtain pinned official municipal boundaries
        run: |
          mkdir -p data/e009
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 720 --silent --show-error \
            'https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2022/Brasil/BR/BR_Municipios_2022.zip' \
            --output data/e009/municipios_2022.zip
          echo '9c904fa1feb978a89042bfecd7758e571266f285d6122a4ff02ffe37bffb76a2  data/e009/municipios_2022.zip' | sha256sum --check
      - name: Evaluate conditional Moran on the two geographic graphs
        run: |
          python -m electoral_analysis.state_conditional_moran \
            --panel outputs/e005-results/municipal_results.json \
            --census data/reference/ibge_4714_2022.json \
            --geometry data/e009/municipios_2022.zip \
            --out-dir outputs/e009
      - name: Generate conditional Moran vector graphic
        run: |
          python -m electoral_analysis.conditional_moran_figure \
            outputs/e009/conditional_moran.json \
            --out outputs/e009/conditional_moran.svg
      - name: Retain audited aggregate research results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e009-within-state-moran
          path: outputs/e009/
          retention-days: 14
          if-no-files-found: warn
