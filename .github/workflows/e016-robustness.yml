name: E016 guarded turnout robustness
on:
  workflow_dispatch:
  push:
    branches: [feat/e016-guarded-turnout-reveal]
permissions:
  contents: read
  actions: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Unit tests and lint
        run: |
          python -m pytest -q
          python -m ruff check src tests
      - uses: actions/download-artifact@v4
        with:
          name: e005-neutral-aggregated-results
          path: .
          run-id: 39069589159
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: e006-ibge-turnout-validation
          path: .
          run-id: 39072126444
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reproduce 245 paths on verified archives
        run: |
          python -m electoral_analysis.arrival_robustness \
            --panel outputs/e005-results/municipal_results.json \
            --census data/reference/ibge_4714_2022.json \
            --out-dir outputs/e016 --reps 120 --seed 20261026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e016-guarded-turnout-results
          path: outputs/e016/
          retention-days: 14
          if-no-files-found: warn
